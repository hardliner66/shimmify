[package]
name = "shimmify"
version = "1.1.2"
edition = "2024"
description = "A library to simplify testing applications by making it possible to easily switch between different versions of binaries, without having to replace the original!"
repository = "https://github.com/hardliner66/shimmify"
license-file = "LICENSE"
readme = "README.md"


[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
shellexpand = { version = "3.1.2", features = ["full"] }
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
anyhow = "1"
